<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="776" viewBox="0 0 1000 776" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">ESP32-S3 int8 inference architecture</title>
  <desc id="archDesc">Three memory tiers (microSD, PSRAM, internal SRAM) feeding a dual-core Xtensa LX7 execution tier, with the int8 KV cache and model library in PSRAM and the int8 weights and fp32 hot window in internal SRAM.</desc>

  <rect width="1000" height="776" fill="#0d1b2a"/>

  <text x="40" y="48" fill="#e6f3f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="bold">ESP32-S3 int8 inference: memory and execution</text>
  <text x="40" y="74" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">260K-parameter decoder · batch size one · 512-token context · measured on one board</text>

  <!-- SD -->
  <rect x="40" y="100" width="920" height="86" rx="6" fill="#11263a" stroke="#2a4a5e" stroke-width="1.5"/>
  <text x="62" y="128" fill="#f0b429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold">microSD — cold store</text>
  <text x="62" y="152" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">models/*.m8 · 290,816 B per blob · FATFS, 1-bit, 40 MHz</text>
  <text x="62" y="172" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">read 4.31 MB/s · mount 82–88 ms</text>
  <rect x="700" y="114" width="236" height="58" rx="4" fill="#0d1b2a" stroke="#2a4a5e"/>
  <text x="716" y="136" fill="#7fd7e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">NVS: last selected basename</text>
  <text x="716" y="156" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">boot order: last → default → flash</text>

  <!-- arrow SD -> PSRAM -->
  <line x1="500" y1="186" x2="500" y2="220" stroke="#7fd7e8" stroke-width="2"/>
  <polygon points="494,214 500,224 506,214" fill="#7fd7e8"/>
  <text x="516" y="208" fill="#7fd7e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">stage 233 ms · SHA-256 verified</text>

  <!-- PSRAM -->
  <rect x="40" y="224" width="920" height="160" rx="6" fill="#11263a" stroke="#2a4a5e" stroke-width="1.5"/>
  <text x="62" y="252" fill="#7fd7e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold">PSRAM 8 MB, octal 80 MHz — warm store</text>
  <text x="62" y="280" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">int8 KV cache 245,760 B</text>
  <text x="62" y="300" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">K 81,920 B + V 81,920 B + scales 81,920 B</text>
  <text x="62" y="322" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">model cache: active blob + 3 LRU slots</text>
  <text x="62" y="342" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">≈295 KB per slot · switch without a reboot</text>
  <text x="62" y="366" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">MoE expert sidecar (synthetic)</text>
  <text x="600" y="280" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">10,240 B int8 weights spill</text>
  <text x="600" y="300" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">weights that do not fit in SRAM</text>
  <text x="600" y="330" fill="#f0b429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">free ≈ 6.9 MB</text>
  <text x="600" y="356" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">cache is PSRAM because SRAM cannot hold it</text>

  <!-- arrow PSRAM -> SRAM -->
  <line x1="500" y1="384" x2="500" y2="418" stroke="#7fd7e8" stroke-width="2"/>
  <polygon points="494,412 500,422 506,412" fill="#7fd7e8"/>
  <text x="516" y="406" fill="#7fd7e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">copy 4.7 ms + sanity 17 ms · cached select 29.4 / 30.0 ms</text>

  <!-- SRAM -->
  <rect x="40" y="422" width="920" height="150" rx="6" fill="#11263a" stroke="#2a4a5e" stroke-width="1.5"/>
  <text x="62" y="450" fill="#7fd7e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold">Internal SRAM 512 KB — hot</text>
  <text x="62" y="478" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">int8 weights 250,368 B + scales 14,048 B</text>
  <text x="62" y="500" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">fp32 hot window, 16 positions: 20,480 B</text>
  <text x="62" y="522" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">newest K/V stay fp32 so short context skips the int8 path</text>
  <text x="62" y="548" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">free 13,231 B · largest block 7,680 B · 64 KB D-cache, 32 B lines</text>
  <text x="600" y="478" fill="#f0b429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">flash 16 MB</text>
  <text x="600" y="500" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">app image + fallback .m8 blob</text>
  <text x="600" y="520" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">at 0x210000, used if the card fails</text>

  <!-- arrow SRAM -> cores -->
  <line x1="500" y1="572" x2="500" y2="606" stroke="#7fd7e8" stroke-width="2"/>
  <polygon points="494,600 500,610 506,600" fill="#7fd7e8"/>

  <!-- Execution -->
  <rect x="40" y="610" width="920" height="110" rx="6" fill="#11263a" stroke="#f0b429" stroke-width="1.5"/>
  <text x="62" y="638" fill="#f0b429" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold">2 × Xtensa LX7 @ 240 MHz — execution</text>
  <text x="62" y="662" fill="#cfe2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">128-bit PIE integer SIMD · upper heads on core 1, one notification pair per layer</text>
  <text x="62" y="684" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">K dot 3,314.8 µs · softmax+fold 3,305.3 µs · V dot 1,448.0 µs (core time, summed over both cores)</text>
  <text x="62" y="706" fill="#8aa3b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">decode 6.00 ms/forward · 166.6 forwards/s at 512 context · attention is 76.7% of a token</text>

  <text x="40" y="752" fill="#5f7c8c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">v1.2.0 research baseline. The model library, PSRAM cache and MoE sidecar are v1.3.0 and were not evaluated in the manuscript.</text>
</svg>
